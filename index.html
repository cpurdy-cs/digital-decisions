<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Decisions</title><style>
:root{font-family:system-ui,sans-serif;background:#0a1524;color:#edf5f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#1b4354,transparent 44%),#0a1524}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #6ce8c5;outline-offset:3px}.wrap{max-width:1100px;margin:auto;padding:24px 24px 70px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #304557;padding-bottom:20px;gap:14px}.brand{font-weight:900;letter-spacing:.07em}.brand b{background:#55ddbd;color:#0b2530;padding:12px;border-radius:9px;margin-right:10px}.muted{color:#a6bed0}.tag{color:#6bdec1;text-transform:uppercase;letter-spacing:.16em;font-size:12px;font-weight:800}h1,h2,h3{letter-spacing:-.04em}h1{font-size:clamp(42px,6vw,72px);line-height:1.04;margin:18px 0}h2{font-size:clamp(29px,4vw,42px);margin:12px 0 22px}h3{font-size:23px;margin:12px 0}p{line-height:1.65;color:#b4c9d9}.hero{padding:74px 0 42px;max-width:760px}.hero p{font-size:19px}.btn{background:#5ce0be;color:#082822;border:0;border-radius:10px;padding:13px 20px;font-weight:800;margin:5px 6px 5px 0}.btn.alt{background:#213b50;color:#edf5f8;border:1px solid #48677b}.btn:disabled{opacity:.35;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.panel{background:#14283a;border:1px solid #345064;border-radius:18px;padding:28px;margin:16px 0}.case{min-height:245px}.case .number{font-size:43px;font-weight:900;color:#5c8496}.case.off{opacity:.55}.case small{color:#73e1c1}.screen{max-width:880px;margin:48px auto}.progress{display:flex;gap:6px;margin:20px 0 32px}.progress i{height:6px;flex:1;background:#2d4a60;border-radius:9px}.progress i.done{background:#56e0b9}.choice{display:block;width:100%;text-align:left;color:#eff7fc;background:#1b3449;border:1px solid #466176;border-radius:11px;padding:16px;margin:9px 0;line-height:1.5}.choice:hover{background:#28495c}.choice.selected{border-color:#72e6c7;background:#244e53}.evidence{background:#203d4d;border-left:3px solid #5be0bb;padding:17px 21px;margin:18px 0;border-radius:9px}.note{background:#3a3634;border:1px solid #88774e;border-radius:9px;padding:14px;margin:14px 0;color:#f7dfb3;line-height:1.5}.note.good{background:#173b3a;color:#b8f2df;border-color:#478c7e}.mail{background:#f0f5f9;color:#183248;padding:24px;border-radius:12px}.mail p{color:#29465b}.mail small{color:#536d7c}.mail .action{background:#2874a7;color:white;display:inline-block;padding:13px;border-radius:6px}.inspect button{margin:7px 7px 0 0;background:#d7e7ee;border:1px solid #9ac2d1;border-radius:7px;padding:8px;color:#224257}.timeline{border-left:2px solid #5b9aa2;padding-left:24px;margin-left:12px}.event{margin:20px 0;position:relative}.event:before{content:'';position:absolute;left:-31px;top:6px;width:12px;height:12px;border-radius:50%;background:#5fe1ba}input,textarea{padding:13px;background:#0f2335;color:white;border:1px solid #5a7587;border-radius:9px;width:100%;margin:8px 0 15px}textarea{min-height:125px;resize:vertical}.report{background:#f0f6f5;color:#193042;border-radius:12px;padding:24px;margin-top:25px}.report p{color:#395368}.review{background:#dcebe8;border-radius:8px;margin:9px 0;padding:12px}.score{font-size:45px;color:#65e1bf;font-weight:900}.sources{margin-top:25px;font-size:13px;color:#90acc1}a{color:#78ebcd}.foot{font-size:12px;color:#819eb2;border-top:1px solid #304557;margin-top:60px;padding-top:20px}@media(max-width:650px){.wrap{padding:16px}.grid{grid-template-columns:1fr}.panel{padding:19px}.screen{margin:24px auto}header .muted{display:none}}@media print{body{background:white;color:black}.noprint,header,.foot{display:none!important}.wrap{padding:0}.report{border:1px solid black;background:white}}
</style><style>
/* Make the opening instruction of each stage visually distinct from evidence and choices. */
.screen > p:first-of-type {
  margin: 0 0 30px;
  padding: 22px 26px 24px;
  border-radius: 13px;
  border: 1px solid #4b7b8a;
  border-left: 5px solid #62e0bf;
  background: linear-gradient(125deg,#22465a,#183449);
  color: #f1f9ff;
  font-size: 18px;
  line-height: 1.6;
  box-shadow: 0 10px 30px rgba(0,0,0,.14);
}
.screen > p:first-of-type::before {
  content: "YOUR MISSION";
  display: block;
  margin-bottom: 10px;
  color: #86efd4;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .16em;
}
@media(max-width:650px){.screen > p:first-of-type{padding:18px;font-size:16px}}
.mock-email{background:#f4f8fb;color:#183147;border:1px solid #b9cdd9;border-radius:12px;overflow:hidden;margin:18px 0 26px;box-shadow:0 7px 22px rgba(0,0,0,.22)}
.mock-email .mail-chrome{background:#dce7ed;border-bottom:1px solid #bfd0d9;color:#345265;font-size:12px;font-weight:800;letter-spacing:.12em;padding:11px 20px}
.mock-email .mail-headers{padding:18px 22px;border-bottom:1px solid #cfdee7;display:grid;gap:12px}
.mock-email .mail-field{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:baseline}
.mock-email .mail-field span{font-size:11px;font-weight:800;color:#557286;letter-spacing:.1em}
.mock-email .mail-field strong{font-size:16px;color:#102d42;overflow-wrap:anywhere}
.mock-email .mail-content{padding:24px 22px 28px;font-size:18px;line-height:1.65;color:#19364b;min-height:105px}
.mock-email .mail-content .simulated-link{color:#095e9e;text-decoration:underline;overflow-wrap:anywhere;font-weight:700}
@media(max-width:650px){.mock-email .mail-field{grid-template-columns:1fr;gap:2px}.mock-email .mail-content{font-size:16px;padding:18px}}
</style></head><body><div class="wrap"><header><div class="brand"><b>DD</b>DIGITAL DECISIONS</div><span class="muted">CS1 INVESTIGATION DIVISION</span><span class="tag">TRAINING SIMULATION</span></header><main id="app"></main><footer class="foot">Fictional students and incidents. Never type real passwords into the simulation. Case progress is local to this browser session.</footer></div><script>
const app=document.getElementById('app');const stepNames=['Briefing','Inbox evidence','Login timeline','Credential lab','Incident response','Final verdict','Knowledge check','Case closed'];let step=-1,team='',answers={},verdictText='',quiz={},quizScore=0;
const qs=[['Which detail is most suspicious in the message?',['It uses a logo','Its sender domain is not verified as the school domain','It arrives at night'],1,'A familiar display name or logo can be faked; verify sender domains and requests through trusted channels.'],['How should you verify the account warning?',['Use the message’s link','Reply with the password','Visit the known school site independently or contact IT'],2,'Navigate independently using a trusted address or support channel.'],['Which password practice is best?',['Reuse a short complex-looking password','Use a long unique passphrase or a password manager-generated password','Use your mascot and graduation year'],1,'Length, uniqueness and unpredictability matter more than easy substitutions.'],['What does multifactor authentication do?',['Adds a barrier if the password is stolen','Makes a device virus-proof','Replaces all security precautions'],0,'MFA adds security; phishing-resistant options such as passkeys or security keys are especially valuable.'],['What should you do with an unexpected executable attachment?',['Run it to see what happens','Forward to friends','Do not run it; report it and follow approved scanning procedures'],2,'Suspicious files may carry malware. Use approved security tools and reporting practices.'],['Which action shows responsible school software use?',['Disable antivirus to install any game','Install only authorized software from verified sources','Ignore an operating-system update indefinitely'],1,'Approved sources, security updates and appropriate detection tools help prevent malware.']];
const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(html){app.innerHTML=html;window.scrollTo(0,0)}function home(){step=-1;draw(`<section class="hero"><div class="tag">The investigation files / Digital citizenship</div><h1>Every click<br>leaves a clue.</h1><p>Four incidents. Conflicting evidence. Real decisions. You and your partner are the investigators. Discover what happened, defend your conclusions, and make technology safer.</p><button class="btn" onclick="start()">Open Case 01 →</button><span class="muted">About 45 minutes per case · Work in pairs</span></section><h2>Investigation files</h2><div class="grid"><article class="panel case"><div class="number">01</div><h3>Account Compromised</h3><p>Follow a phishing trail and secure a school account.</p><small>AVAILABLE NOW</small><p><button class="btn alt" onclick="start()">Investigate →</button></p></article>${[['02','The Stolen Game','Copyright and software licensing'],['03','The Group Chat','Privacy, sharing and etiquette'],['04','The Algorithm','AI and societal consequences']].map(a=>`<article class="panel case off"><div class="number">${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p><small>IN DEVELOPMENT</small></article>`).join('')}</div><p class="sources">Cases 02–04 are planned, not yet playable. This first release is designed for testing with students before expanding the unit.</p>`)}function start(){step=0;render()}function next(){step++;render()}function back(){step=Math.max(0,step-1);render()}function frame(content){draw(`<section class="screen"><div class="tag">Case 01 / Account Compromised · ${step+1} of 8</div><h2>${stepNames[step]}</h2><div class="progress">${stepNames.map((_,i)=>`<i class="${i<=step?'done':''}"></i>`).join('')}</div>${content}</section>`)}function nav(ready=true,title='Continue'){return `<div class="noprint" style="margin:25px 0"><button class="btn alt" onclick="back()">← Back</button><button class="btn" ${ready?'':'disabled'} onclick="next()">${title} →</button></div>`}
function choices(id,items){return items.map((x,i)=>`<button class="choice ${answers[id]===i?'selected':''}" onclick="pick('${id}',${i})"><b>${String.fromCharCode(65+i)}.</b> ${x}</button>`).join('')}function pick(id,i){answers[id]=i;render()}function feedback(id,correct,msg){return answers[id]===undefined?'':`<div class="note ${answers[id]===correct?'good':''}">${msg}</div>`}
function render(){if(step===0)frame(`<div class="panel"><div class="tag">Incident report / 08:14 Monday</div><h3>Someone was inside Avery's account.</h3><p>At 7:52 this morning, a message containing a suspicious download link was sent from Avery Chen's school account to 28 classmates. Avery insists they never sent it. Technology staff found a successful login from an unfamiliar device after midnight.</p><div class="evidence"><b>Assignment</b><p>Examine an email, reconstruct the timeline, investigate passwords and authentication, and recommend a response. Be careful: plausible is not the same as proven.</p></div><label>Investigator names (optional)</label><input id="team" maxlength="70" value="${esc(team)}" placeholder="Team name or first names"><p class="muted">No account or password is needed.</p><button class="btn" onclick="team=document.getElementById('team').value;next()">Accept case →</button></div>`);
if(step===1)frame(`<p>Technology staff recovered this message. Inspect the evidence before deciding what to do.</p><div class="mail"><small>From: School Technology Desk &lt;help@school-verify-support.net&gt;</small><h3>URGENT: Your account will be locked</h3><p>We detected suspicious activity. To prevent permanent deletion in 10 minutes, verify your password immediately.</p><span class="action">VERIFY YOUR ACCOUNT</span><p><small>Displayed destination: school-login-check.example/verify (fictional)</small></p><div class="inspect"><button onclick="clue('The sender uses an unverified lookalike domain. Display names and branding can be forged.')">Sender</button><button onclick="clue('A link can lead to a credential-stealing website. HTTPS alone does not establish legitimacy; do not open suspicious links.')">Destination</button><button onclick="clue('An urgent countdown can pressure people into acting before they verify.')">Wording</button></div></div><div class="evidence" id="clue">Select sender, destination, or wording to inspect the evidence.</div><h3>What should Avery do?</h3>${choices('email',['Click immediately to avoid deletion','Use the known school site or established IT contact independently','Reply with their password'])}${feedback('email',1,'Use a separate trusted channel to verify suspicious requests. Never send a password to support staff.')}${nav(answers.email!==undefined,'Review login log')}`);
if(step===2)frame(`<p>Avery's login history reveals an unusual sequence. What does it actually prove?</p><div class="panel"><div class="timeline"><div class="event"><b>Sunday 9:41 PM</b><p>Avery opens the urgent account message.</p></div><div class="event"><b>Sunday 9:43 PM</b><p>A password is entered at school-login-check.example.</p></div><div class="event"><b>Monday 12:16 AM</b><p>A successful sign-in uses Avery's password from an unfamiliar device.</p></div><div class="event"><b>Monday 7:52 AM</b><p>A suspicious message is sent to 28 classmates.</p></div></div><div class="evidence"><b>Evidence vs. inference</b><p>This strongly suggests credential phishing followed by unauthorized access. It does not prove who controlled the unfamiliar device, and receiving a link does not prove a virus infection.</p></div></div><h3>Strongest conclusion?</h3>${choices('timeline',['Avery definitely sent the message intentionally','The account was likely compromised following credential entry on a lookalike site','Every recipient is infected'])}${feedback('timeline',1,'Investigators must distinguish supported conclusions from unsupported certainty.')}${nav(answers.timeline!==undefined,'Open credential lab')}`);
if(step===3)frame(`<p>Avery's password may have been stolen. Technology staff ask Avery to create a new password that is not used on any other account. Compare these fictional examples. Do not use any of them as your own password.</p><div class="panel"><h3>Which example shows the strongest approach for Avery's replacement password?</h3>${choices('password',['Hornets2026!','P@ssw0rd!','cobalt-window-river-otter-42'])}${feedback('password',2,'A long, unique, hard-to-predict passphrase is generally preferable to short predictable words and substitutions. A reputable password manager can help create unique passwords.')}<hr style="border-color:#355167;margin:25px 0"><div class="evidence"><b>New tool: Multi-factor authentication (MFA)</b><p>Multi-factor authentication means using more than one type of proof to sign in. For example, after entering a password, you might also need to approve a request on a registered device or use a security key.</p><p>If someone steals your password, that extra step can help stop them from accessing your account. But you still need to be careful: attackers may try to trick you into approving a sign-in you didn't request.</p></div><h3>Suppose someone tries to sign in with Avery's stolen password, but Avery has MFA enabled. What would happen?</h3>${choices('mfa',['Knowing the password would automatically let the person in','The person would also need the second factor or would have to trick Avery into approving the sign-in','The school would automatically change Avery’s password'])}${feedback('mfa',1,'MFA adds another requirement beyond the password. It makes unauthorized access harder, though attackers may still try to steal or trick people into approving the second factor.')}<div class="evidence"><b>Security briefing</b><p>Length and uniqueness matter. Reusing passwords allows one breach to threaten multiple accounts. MFA helps protect an account, though no protection is perfect.</p></div></div>${nav(answers.password!==undefined&&answers.mfa!==undefined,'Prepare incident response')}`);
if(step===4)frame(`<p>The school needs to respond to two problems. A classmate received Avery's suspicious download link but has not clicked it. Meanwhile, an unfamiliar device may still have access to Avery's account. Decide the next step in each situation.</p><div class="panel"><h3>A classmate sees Avery's unexpected grade-viewer download link. What should the classmate do now?</h3>${choices('malware',['Open the link to find out whether the program is real','Leave the link unopened and report the message through a trusted school IT channel','Forward the link to the class group chat so everyone can inspect it'])}${feedback('malware',1,'The classmate should avoid the unverified download and report the message. Forwarding the suspicious link could expose more people, and receiving a link alone does not mean the device is infected.')}<hr style="border-color:#355167;margin:25px 0"><h3>Technology staff find that an unfamiliar device is still signed in to Avery's account. What should Avery and IT do?</h3>${choices('recovery',['Report and investigate the incident, change the password through the real school site, sign out unfamiliar sessions and review MFA','Delete the suspicious messages and wait to see whether it happens again','Turn off MFA to make the account easier to access'])}${feedback('recovery',0,'The priority is to stop unauthorized access and recover the account securely. Removing sent messages alone would not end an attacker’s active session.')}<div class="evidence"><b>Incident summary</b><p>These are two separate concerns: protecting classmates from the suspicious download link and stopping unauthorized access to Avery's account. Neither situation proves that a student ran malware. The next investigation will examine suspicious files more closely.</p></div></div>${nav(answers.malware!==undefined&&answers.recovery!==undefined,'Inspect suspicious files')}`);
if(step===5)frame(`<p>A sound verdict uses the available evidence and admits what is not yet known.</p><div class="panel"><h3>Choose the supported explanation</h3>${choices('verdict',['There is no reason to investigate','Likely credential phishing and account misuse; secure the account and investigate','All recipients definitely have a virus'])}<label><b>Case explanation:</b> Cite two pieces of evidence and propose one response.</label><textarea id="verdictText" maxlength="1400" placeholder="The evidence shows... This suggests... We recommend...">${esc(verdictText)}</textarea><button class="btn" onclick="submitVerdict()">Submit verdict →</button><button class="btn alt" onclick="back()">← Back</button><p class="muted">Minimum 40 characters. Your response will appear in the printable case report.</p></div>`);
if(step===6)frame(`<p>Complete this six-question knowledge check. For individual assessment, each partner should complete their own session.</p><div class="panel">${qs.map((q,i)=>`<section style="margin-bottom:29px"><div class="tag">Question ${i+1} of ${qs.length}</div><h3>${q[0]}</h3>${q[1].map((o,j)=>`<button class="choice ${quiz[i]===j?'selected':''}" onclick="answerQuiz(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`).join('')}</section>`).join('')}<button class="btn" ${Object.keys(quiz).length===qs.length?'':'disabled'} onclick="finish()">Submit knowledge check →</button><p class="muted">Answers stay in this browser session; no server collects them.</p></div>`);
if(step===7){let code=completion();frame(`<div class="panel"><div class="tag">Investigation completed</div><h2>Case 01 closed.</h2><div class="grid"><div class="evidence"><b>Knowledge check</b><div class="score">${quizScore}/6</div></div><div class="evidence"><b>Completion code</b><h3>${code}</h3><small>Record this code for your teacher.</small></div></div><div class="note ${answers.verdict===1?'good':''}">${answers.verdict===1?'Your verdict is supported by the available evidence.':'Revisit the investigation: the evidence supports likely compromise, not a definitive claim about the attacker or virus infection.'}</div><div class="noprint"><button class="btn" onclick="window.print()">Print / Save case report</button><button class="btn alt" onclick="home()">Case board</button></div></div><div class="report"><h3>Investigation report</h3><p><b>Investigators:</b> ${esc(team||'Not supplied')}<br><b>Case:</b> Account Compromised<br><b>Completion:</b> ${code}<br><b>Knowledge:</b> ${quizScore}/6</p><p><b>Verdict rationale:</b> ${esc(verdictText)}</p><h3>Review and explanations</h3>${qs.map((q,i)=>`<div class="review"><b>${i+1}. ${esc(q[0])}</b><br>Your answer: ${esc(q[1][quiz[i]])} ${quiz[i]===q[2]?'✓':'✕'}<br><small>${esc(q[3])}</small></div>`).join('')}<p><small>Teacher note: Codes are a convenient record of completion, not proof of identity. Use the individual report or follow-up discussion to verify mastery.</small></p></div><div class="sources">Reference material: <a href="https://www.nist.gov/cybersecurity-and-privacy/how-do-i-create-good-password" target="_blank" rel="noopener">NIST password guidance</a> · <a href="https://www.cisa.gov/secure-our-world" target="_blank" rel="noopener">CISA Secure Our World</a></div>`)}}
function clue(t){document.getElementById('clue').textContent=t}function submitVerdict(){verdictText=document.getElementById('verdictText').value.trim();if(answers.verdict===undefined||verdictText.length<40){alert('Select a verdict and explain your conclusion in at least 40 characters.');return}next()}function answerQuiz(i,j){quiz[i]=j;render()}function finish(){quizScore=qs.reduce((n,q,i)=>n+(quiz[i]===q[2]?1:0),0);next()}function completion(){let checksum=qs.reduce((n,_,i)=>n+(quiz[i]+1)*(i+3),0);return `DD-01-${String(quizScore).padStart(2,'0')}-${String((checksum*7+41)%997).padStart(3,'0')}`}home();
</script><script src="expansion.js"></script><script src="report-download.js"></script><script src="classroom.js"></script></body></html>
